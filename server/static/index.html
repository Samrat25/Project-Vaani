<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaani — Live Waveform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-[#f8fafc] text-slate-700 font-['Inter',sans-serif] min-h-screen flex flex-col antialiased">

  <!-- TOP BAR -->
  <header class="bg-white border-b border-slate-200/80 px-6 py-3.5 flex items-center justify-between shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-white shadow-xs">
        <i data-lucide="activity" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm font-semibold text-slate-900 tracking-tight">Vaani</h1>
      </div>
    </div>

    <!-- Status -->
    <div class="flex items-center space-x-3">
      <div id="statusBadge" class="flex items-center px-2.5 py-1 rounded-full text-xs font-mono bg-slate-100 border border-slate-200 text-slate-600">
        <span id="statusText">Ready</span>
      </div>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col space-y-5">

    <!-- CONTROLS BAR -->
    <div class="bg-white border border-slate-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-xs">
      
      <!-- Left: Device & Streaming -->
      <div class="flex items-center flex-wrap gap-2.5">
        <!-- Mic Select -->
        <div class="relative min-w-[200px] sm:min-w-[240px]">
          <select id="micSelect" class="w-full bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2 pr-8 appearance-none focus:outline-none focus:ring-1 focus:ring-slate-400 font-mono transition-colors">
            <option value="">Microphone...</option>
          </select>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>

        <!-- Stream Start / Stop Button -->
        <button id="toggleStreamBtn" class="px-4 py-2 rounded-lg text-xs font-medium flex items-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white transition-all shadow-xs active:scale-[0.98]">
          <i data-lucide="play" id="streamBtnIcon" class="w-3.5 h-3.5 fill-current"></i>
          <span id="streamBtnLabel">Start</span>
        </button>
      </div>

      <!-- Right: Bypass Filter, Mute & Volume Controls -->
      <div class="flex items-center flex-wrap gap-2">
        
        <!-- Bypass Filtering Button -->
        <button id="bypassBtn" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center space-x-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 transition-colors" title="Toggle filter bypass (listen to raw mic instead of filtered audio)">
          <i data-lucide="sliders-horizontal" id="bypassIcon" class="w-3.5 h-3.5 text-slate-500"></i>
          <span id="bypassLabel">Bypass Filter</span>
        </button>

        <!-- Mute Mic Button -->
        <button id="muteMicBtn" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center space-x-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 transition-colors">
          <i data-lucide="mic" id="muteMicIcon" class="w-3.5 h-3.5 text-slate-600"></i>
          <span id="muteMicLabel">Mute Mic</span>
        </button>

        <!-- Mute Speaker Button -->
        <button id="muteSpeakerBtn" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center space-x-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 transition-colors">
          <i data-lucide="volume-2" id="muteSpeakerIcon" class="w-3.5 h-3.5 text-slate-600"></i>
          <span id="muteSpeakerLabel">Mute Speaker</span>
        </button>

        <!-- Output Volume Slider -->
        <div class="hidden sm:flex items-center space-x-2 pl-2 border-l border-slate-200">
          <i data-lucide="volume-1" class="w-3.5 h-3.5 text-slate-400"></i>
          <input id="volumeSlider" type="range" min="0" max="100" value="100" class="w-20 accent-slate-700 h-1 bg-slate-200 rounded-lg cursor-pointer" title="Speaker volume">
        </div>

      </div>

    </div>

    <!-- AUDACITY STYLE 30-SECOND CONTINUOUS WAVEFORM TRACKS -->
    <div class="space-y-4 flex-1 flex flex-col justify-center">

      <!-- TRACK 1: RAW INPUT WAVEFORM -->
      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-xs">
        <!-- Track Header -->
        <div class="px-4 py-2 bg-slate-50/80 border-b border-slate-200 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2.5">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            <span class="font-medium text-slate-800">Raw Input</span>
            <span class="text-[11px] font-mono text-slate-400">30.0s window</span>
            <!-- Click to play hint -->
            <span id="rawPlayHint" class="hidden text-[11px] text-slate-400 italic">Click waveform to play</span>
          </div>
          <div class="flex items-center space-x-2.5 font-mono text-[11px] text-slate-600">
            <!-- Review Play / Stop Button -->
            <button id="playRawBtn" class="hidden px-2.5 py-1 rounded-md text-[11px] font-medium flex items-center space-x-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 transition-colors" title="Play recorded raw audio">
              <i data-lucide="play" id="playRawBtnIcon" class="w-3 h-3 fill-current"></i>
              <span id="playRawBtnLabel">Play Raw</span>
            </button>
            <!-- Mention SNR for Raw sound -->
            <span id="rawSnr" class="px-2 py-0.5 rounded bg-slate-100 border border-slate-200 text-slate-700 font-semibold" title="Estimated Signal-to-Noise Ratio">SNR: -- dB</span>
            <span id="rawLevel" class="text-slate-500">-inf dB</span>
          </div>
        </div>

        <!-- Canvas Waveform Plot -->
        <div class="relative w-full h-44 bg-[#fbfcfd]">
          <canvas id="rawWaveformCanvas" class="w-full h-full block cursor-default"></canvas>
        </div>
      </div>

      <!-- TRACK 2: ENHANCED SAMPLE WAVEFORM -->
      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-xs">
        <!-- Track Header -->
        <div class="px-4 py-2 bg-slate-50/80 border-b border-slate-200 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2.5">
            <span class="w-2 h-2 rounded-full bg-teal-500"></span>
            <span class="font-medium text-slate-800">Enhanced Sample</span>
            <span class="text-[11px] font-mono text-slate-400">30.0s window</span>
            <!-- Click to play hint -->
            <span id="procPlayHint" class="hidden text-[11px] text-slate-400 italic">Click waveform to play</span>
          </div>
          <div class="flex items-center space-x-2 font-mono text-[11px] text-slate-600">
            <!-- Review Play / Stop Button -->
            <button id="playProcBtn" class="hidden px-2.5 py-1 rounded-md text-[11px] font-medium flex items-center space-x-1 bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 transition-colors" title="Play recorded filtered audio">
              <i data-lucide="play" id="playProcBtnIcon" class="w-3 h-3 fill-current"></i>
              <span id="playProcBtnLabel">Play Filtered</span>
            </button>
            <!-- Mention SNR, PESQ and STOI above enhanced sample -->
            <span id="procSnr" class="px-2 py-0.5 rounded bg-teal-50 border border-teal-200 text-teal-800 font-semibold" title="Enhanced Signal-to-Noise Ratio">SNR: -- dB</span>
            <span id="procPesq" class="px-2 py-0.5 rounded bg-emerald-50 border border-emerald-200 text-emerald-800 font-semibold" title="Perceptual Evaluation of Speech Quality">PESQ: --</span>
            <span id="procStoi" class="px-2 py-0.5 rounded bg-cyan-50 border border-cyan-200 text-cyan-800 font-semibold" title="Short-Time Objective Intelligibility">STOI: --</span>
            <span id="procLevel" class="text-slate-500">-inf dB</span>
          </div>
        </div>

        <!-- Canvas Waveform Plot -->
        <div class="relative w-full h-44 bg-[#fbfcfd]">
          <canvas id="procWaveformCanvas" class="w-full h-full block cursor-default"></canvas>
        </div>
      </div>

    </div>

  </main>

  <!-- MINIMAL LIGHT FOOTER -->
  <footer class="py-3 text-center text-xs font-mono text-slate-400 border-t border-slate-200/60">
    <span>30.0s Continuous Window &bull; Click Waveform to Play</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
