version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. Python FastAPI Backend (DPDFNet-8 ONNX Audio Engine)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vaani-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VAANI_HOST=0.0.0.0
      - VAANI_PORT=8000
      - VAANI_MODEL_DIR=/app/models/pretuned/dpdfnet
    volumes:
      # Mount models folder so the 48kHz ONNX weights persist across restarts
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - vaani-network

  # -------------------------------------------------------------
  # 2. Next.js 14 Web Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # If deploying behind Nginx on the same domain, leave blank or set to wss://yourdomain.com/ws/stream
        - NEXT_PUBLIC_VAANI_WS_URL=${NEXT_PUBLIC_VAANI_WS_URL:-}
    container_name: vaani-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vaani-network

  # -------------------------------------------------------------
  # 3. Nginx Reverse Proxy (Unified Domain & WSS Support)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vaani-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL certificates are mounted
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro # For SSL certificates
    depends_on:
      - backend
      - frontend
    networks:
      - vaani-network

networks:
  vaani-network:
    driver: bridge
